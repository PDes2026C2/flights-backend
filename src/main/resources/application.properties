spring.application.name=flights
server.port=8081
spring.web.resources.add-mappings=false

spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

spring.jpa.hibernate.ddl-auto=none

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:password}

# Management traffic uses a dedicated port, kept internal by the global Compose.
management.server.port=9092
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Logs JSON con el nombre del servicio y el contexto de cada solicitud.
logging.structured.format.console=ecs
spring.main.banner-mode=off

# Contexto W3C en HTTP; la exportación OTLP se activa sólo cuando se solicita.
management.tracing.propagation.type=w3c
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
management.tracing.export.otlp.enabled=${TRACING_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
# Los logs y las métricas conservan sus canales Loki y Prometheus.
management.logging.export.enabled=false
management.otlp.metrics.export.enabled=false
